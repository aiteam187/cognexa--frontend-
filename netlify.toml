[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Same-path email endpoint as the Azure setup, so the frontend code doesn't
# need to know which platform it's deployed on.
[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

# Everything else that isn't a real file falls back to the SPA shell,
# so client-side routing (react-router) handles the URL.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
